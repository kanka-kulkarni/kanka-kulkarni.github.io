<style>
:root{--bg:#F2F4F9;--surface:#FFFFFF;--ink:#141A2E;--muted:#555E78;--line:#DCE1EC;--cobalt:#2A45C8;--cobalt-ink:#fff;--hl:#F2C94C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151F;--surface:#1A1F2E;--ink:#ECEEF4;--muted:#A1A8BC;--line:#2B3246;--cobalt:#93A6FF;--cobalt-ink:#10152B;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
main{max-width:560px;width:100%}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:750;font-variation-settings:"wdth" 82;font-size:clamp(48px,10vw,76px);letter-spacing:-.025em;line-height:1}
h1::after{content:"";display:block;width:84px;height:12px;border-radius:6px;background:var(--hl);margin-top:18px}
p{color:var(--muted);margin-top:18px;font-size:18px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
a{display:inline-flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;text-decoration:none;color:var(--ink);padding:12px 18px;border-radius:12px;border:1.5px solid var(--ink)}
a.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
a:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:3px}
svg{width:17px;height:17px}
</style>
</head>

<main>
